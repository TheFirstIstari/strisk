[package]
name = "strisk"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
clap = { version = "4", features = ["derive"] }
crc32fast = "1.5.2"
flate2 = "1.1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
png = "0.17"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
